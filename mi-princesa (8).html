<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Princesa ❤️</title>
<style>
/* ============================================================
   TOKENS DE DISEÑO
   Paleta: blanco cálido, girasol, verde natural, dorado
   Tipografía: serif elegante para cuerpo, cursiva para firma
   ============================================================ */
:root{
  --cream:#fbf6ea;
  --cream-2:#f7efd9;
  --sun-yellow:#f6c243;
  --sun-yellow-deep:#e8a916;
  --sun-center:#7a4a1e;
  --leaf:#5c8a4a;
  --leaf-dark:#3e6432;
  --gold:#c8962c;
  --ink:#4a3524;
  --ink-soft:#7a6650;
  --paper-shadow:rgba(120,90,40,0.18);
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 0%, var(--cream-2) 0%, var(--cream) 60%, #f3e9d2 100%);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color:var(--ink);
  overflow:hidden;
}
.signature{
  font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
  color:var(--gold);
}

/* Contenedor principal de escenas */
#stage{
  position:relative;
  width:100vw;height:100vh;
  overflow:hidden;
}
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6vh 6vw;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease;
  text-align:center;
}
.scene.active{opacity:1;pointer-events:auto;}

/* Capa de pétalos y luz flotante (persistente en toda la experiencia) */
#ambient-layer{
  position:fixed;inset:0;pointer-events:none;z-index:5;
}
.petal{
  position:absolute;top:-5vh;
  width:14px;height:14px;
  background:radial-gradient(circle at 30% 30%, #ffe28a, var(--sun-yellow) 60%, var(--sun-yellow-deep) 100%);
  border-radius:0% 60% 0% 60%;
  opacity:0.85;
  animation-name:fall,sway;
  animation-timing-function:linear,ease-in-out;
  animation-iteration-count:infinite,infinite;
  filter:drop-shadow(0 0 3px rgba(232,169,22,0.35));
}
@keyframes fall{
  from{transform:translateY(-10vh) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}
@keyframes sway{
  0%,100%{margin-left:0px;}
  50%{margin-left:40px;}
}
.spark{
  position:absolute;
  width:4px;height:4px;border-radius:50%;
  background:#fff3cf;
  box-shadow:0 0 8px 2px rgba(255,230,150,0.8);
  animation:twinkle 3.5s ease-in-out infinite;
  opacity:0;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.6);}
  50%{opacity:0.9;transform:scale(1.2);}
}

/* Botón de música */
#music-toggle{
  position:fixed;top:18px;right:18px;z-index:50;
  width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(200,150,44,0.4);
  background:rgba(255,251,240,0.75);
  backdrop-filter:blur(4px);
  cursor:pointer;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(120,90,40,0.15);
  transition:transform .3s ease;
}
#music-toggle:hover{transform:scale(1.08);}

/* ---------- ESCENA 1: PORTADA ---------- */
.title-line{
  font-size:clamp(2.1rem,7vw,3.6rem);
  font-weight:600;
  letter-spacing:0.5px;
  color:var(--ink);
  display:inline-block;
  overflow:hidden;
  white-space:nowrap;
  border-right:2px solid var(--gold);
  width:0;
  animation:typeTitle 1.6s steps(14,end) forwards, blinkCaret 0.75s step-end infinite;
  animation-delay:0.4s;
}
@keyframes typeTitle{ to{ width:14ch; } }
@keyframes blinkCaret{ 50%{ border-color:transparent; } }

.sign-1{
  font-size:clamp(1.6rem,5vw,2.4rem);
  margin-top:6px;
  opacity:0;
  transform:translateY(6px);
  animation:fadeUp 1.2s ease forwards;
  animation-delay:2.3s;
}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0);}
}

.subtitle{
  margin-top:28px;
  font-size:1.05rem;
  color:var(--ink-soft);
  font-style:italic;
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:3.1s;
}

.petal-btn{
  margin-top:44px;
  padding:14px 34px;
  font-size:1.05rem;
  font-family:inherit;
  border-radius:40px;
  border:1.5px solid var(--sun-yellow-deep);
  background:linear-gradient(180deg,#fff6de,var(--cream-2));
  color:var(--ink);
  cursor:pointer;
  box-shadow:0 6px 18px var(--paper-shadow);
  opacity:0;
  animation:fadeUp 1.2s ease forwards, pulseBtn 2.4s ease-in-out infinite 4.5s;
  animation-delay:3.7s,4.5s;
  transition:transform .25s ease, box-shadow .25s ease;
}
.petal-btn:hover{transform:translateY(-2px) scale(1.04); box-shadow:0 10px 24px var(--paper-shadow);}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 6px 18px var(--paper-shadow);}
  50%{box-shadow:0 6px 26px rgba(232,169,22,0.45);}
}

/* ---------- ESCENA 2: CRECIMIENTO ---------- */
#growth-wrap{
  position:relative;
  width:min(92vw,560px);
  height:min(70vh,620px);
}
#ground{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  width:70%;height:6px;
  background:linear-gradient(90deg,transparent, rgba(92,138,74,0.35), transparent);
  border-radius:50%;
}
#seed{
  position:absolute;bottom:8%;left:50%;transform:translate(-50%,0) scale(1);
  width:14px;height:18px;
  background:radial-gradient(circle at 35% 30%, #a9793e, #6b4423);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  animation:seedPulse 1.6s ease-in-out forwards;
  z-index:3;
}
@keyframes seedPulse{
  0%{opacity:0;transform:translate(-50%,0) scale(0.3);}
  30%{opacity:1;transform:translate(-50%,0) scale(1.1);}
  100%{opacity:0;transform:translate(-50%,0) scale(0.2);}
}
#stem-svg{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
  width:100%;height:92%;
  overflow:visible;
}
.stem-path{
  fill:none;
  stroke:var(--leaf-dark);
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:900;
  stroke-dashoffset:900;
  animation:drawStem 3.2s ease forwards;
  animation-delay:1.6s;
}
@keyframes drawStem{ to{ stroke-dashoffset:0; } }

.leaf{
  fill:var(--leaf);
  opacity:0;
  transform-origin:center;
  animation:leafGrow 1s ease forwards;
}
@keyframes leafGrow{
  from{opacity:0;transform:scale(0) rotate(-20deg);}
  to{opacity:1;transform:scale(1) rotate(0deg);}
}

.heart-flower{
  position:absolute;
  width:26px;height:26px;
  opacity:0;
  transform:translate(-50%,-50%) scale(0);
  animation:bloomFlower 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes bloomFlower{
  from{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-30deg);}
  to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg);}
}
.heart-flower svg{width:100%;height:100%;
  filter:drop-shadow(0 0 3px rgba(246,194,67,0.55));
}

/* Capa donde viven únicamente los girasoles del corazón (no el tallo),
   así el latido y el brillo se aplican solo al corazón */
#heart-layer{
  position:absolute;inset:0;
  transform-origin:center;
}
#heart-layer.beat{
  animation:heartbeat 1.15s ease-in-out 3;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  20%{transform:scale(1.08);}
  35%{transform:scale(0.98);}
  50%{transform:scale(1.06);}
  70%{transform:scale(1);}
}
.glow-ring{
  position:absolute;inset:-14%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(246,194,67,0.35), transparent 70%);
  opacity:0;
  pointer-events:none;
  z-index:0;
  transition:opacity 1.6s ease;
}
.glow-ring.show{opacity:1;}

#growth-caption{
  margin-top:18px;
  color:var(--ink-soft);
  font-style:italic;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:0.2s;
  font-size:0.98rem;
}

/* ---------- ESCENA 2 (persistente): PLANTA + PANEL DE DEDICATORIA ---------- */
.plant-stage{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  gap:0;
  transition:gap 1.3s ease, justify-content 1.3s ease;
}
.plant-stage.filled{
  gap:6vw;
}
.dedication-panel{
  flex:0 0 0;
  width:0;
  max-width:460px;
  opacity:0;
  overflow:hidden;
  text-align:left;
  max-height:82vh;
  overflow-y:auto;
  transition:flex-basis 1.3s ease, width 1.3s ease, opacity 1s ease 0.25s;
}
.plant-stage.filled .dedication-panel{
  flex:1 1 420px;
  width:420px;
  opacity:1;
}
.plant-column{
  position:relative;
  flex:0 0 auto;
  transition:transform 1.3s ease;
  transform-origin:center top;
}
.plant-stage.filled .plant-column{
  transform:scale(0.8);
}
.plant-stage.filled #growth-caption{
  opacity:0;height:0;margin:0;overflow:hidden;
}

.headline-3{
  font-size:clamp(1.2rem,3vw,1.6rem);
  opacity:0;
  transition:opacity 1s ease;
}
.headline-3.show{opacity:1;}

#dedication{
  max-width:640px;
  margin-top:22px;
  font-size:1.02rem;
  line-height:1.85;
  color:var(--ink);
  opacity:0;
  transition:opacity .8s ease;
  padding:0 4px;
  max-height:46vh;
  overflow-y:auto;
}
#dedication.show{opacity:1;}
#dedication p{margin:0 0 14px 0;}
#dedication .dsign{font-size:1.5rem;margin-top:6px;}
#continue-btn{
  margin-top:26px;
  padding:11px 28px;
  border-radius:30px;
  border:1.5px solid var(--gold);
  background:transparent;
  color:var(--gold);
  font-family:inherit;
  cursor:pointer;
  opacity:0;
  transition:opacity .6s ease, background .3s ease, color .3s ease;
}
#continue-btn.show{opacity:1;}
#continue-btn:hover{background:var(--gold);color:#fff8e8;}

/* ---------- ESCENA FINAL ---------- */
.final-emoji{
  font-size:clamp(2.4rem,9vw,3.6rem);
  opacity:0;
  animation:fadeUp 1.4s ease forwards;
}
.final-line{
  margin-top:24px;
  font-size:1.15rem;
  max-width:560px;
  color:var(--ink);
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:1s;
}
.final-line-2{
  margin-top:18px;
  font-size:1.1rem;
  color:var(--ink-soft);
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:2s;
}
.final-sign{
  margin-top:10px;
  font-size:2rem;
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:2.7s;
}
.from-line{
  margin-top:26px;
  font-size:0.95rem;
  letter-spacing:0.5px;
  color:var(--ink-soft);
  font-style:italic;
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:3.5s;
}
.replay-btn{
  margin-top:40px;
  font-size:0.85rem;
  color:var(--ink-soft);
  border:none;
  background:none;
  text-decoration:underline;
  cursor:pointer;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:4.3s;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}
@media (max-width:480px){
  .scene{padding:5vh 5vw;}
}
@media (max-width:860px){
  /* En celular: todo se apila verticalmente y se permite scroll,
     en vez del layout de dos columnas usado en pantallas grandes */
  #scene-2.scene{
    align-items:flex-start;
    overflow-y:auto;
    height:100vh;
    padding-top:5vh;
  }
  .plant-stage{
    flex-direction:column;
    height:auto;
    min-height:100%;
    gap:0 !important;
  }
  .dedication-panel{
    order:2;
    width:100% !important;
    max-width:100% !important;
    flex:none !important;
    overflow-y:visible;
    max-height:none;
    margin-top:20px;
  }
  .plant-column{
    order:1;
  }
  .plant-stage.filled .plant-column{
    transform:scale(0.9);
  }
}
</style>
</head>
<body>

<!-- Capa ambiental persistente: pétalos y destellos -->
<div id="ambient-layer"></div>

<!-- Botón de música (usa Web Audio API, no requiere archivos externos) -->
<button id="music-toggle" title="Música">🔇</button>

<div id="stage">

  <!-- ESCENA 1: PORTADA -->
  <section class="scene active" id="scene-1">
    <div>
      <span class="title-line">Mi Princesa...</span>
    </div>
    <div class="sign-1 signature">SSRV</div>
    <div class="subtitle">Tengo un pequeño regalo para ti...</div>
    <button class="petal-btn" id="start-btn">🌻 Haz clic aquí 🌻</button>
  </section>

  <!-- ESCENA 2: CRECIMIENTO DEL REGALO + DEDICATORIA (misma escena, sin
       perder el tallo: la planta se desplaza a la derecha y el texto
       aparece a la izquierda una vez el corazón está completo) -->
  <section class="scene" id="scene-2">
    <div class="plant-stage" id="plant-stage">
      <div class="dedication-panel" id="dedication-panel">
        <div class="headline-3" id="headline-3">🌻 Feliz día de las flores amarillas 🌻</div>
        <div id="dedication"></div>
        <button id="continue-btn">Continuar</button>
      </div>
      <div class="plant-column" id="plant-column">
        <div class="glow-ring" id="glow-ring"></div>
        <div id="growth-wrap">
          <div id="ground"></div>
          <div id="seed"></div>
          <svg id="stem-svg" viewBox="0 0 300 500" preserveAspectRatio="xMidYMax meet"></svg>
          <div id="heart-layer"></div>
        </div>
        <div id="growth-caption">Un pequeño detalle está creciendo para ti...</div>
      </div>
    </div>
  </section>

  <!-- ESCENA FINAL -->
  <section class="scene" id="scene-4">
    <div class="final-emoji">🌻❤️</div>
    <div class="final-line">Estas flores siempre volverán a florecer para ti.</div>
    <div class="final-line-2">Siempre para ti, Mi Princesa ❤️</div>
    <div class="final-sign signature">SSRV</div>
    <div class="from-line">De parte de tu Amorcito</div>
    <button class="replay-btn" id="replay-btn">Volver a empezar</button>
  </section>

</div>

<script>
/* ============================================================
   UTILIDADES GENERALES
   ============================================================ */
const stage = document.getElementById('stage');
function goToScene(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================================
   CAPA AMBIENTAL: pétalos amarillos cayendo + destellos de luz
   Se ejecuta durante toda la experiencia
   ============================================================ */
const ambient = document.getElementById('ambient-layer');

function spawnPetal(){
  const p = document.createElement('div');
  p.className = 'petal';
  const left = Math.random()*100;
  const fallDur = 9 + Math.random()*8;
  const swayDur = 3 + Math.random()*3;
  const size = 8 + Math.random()*10;
  p.style.left = left+'vw';
  p.style.width = size+'px';
  p.style.height = size+'px';
  p.style.animationDuration = fallDur+'s, '+swayDur+'s';
  p.style.animationDelay = (Math.random()*4)+'s, 0s';
  ambient.appendChild(p);
  setTimeout(()=>p.remove(), (fallDur+4)*1000);
}
setInterval(spawnPetal, 900);
for(let i=0;i<6;i++) setTimeout(spawnPetal, i*300);

function spawnSpark(){
  const s = document.createElement('div');
  s.className='spark';
  s.style.left = (Math.random()*100)+'vw';
  s.style.top = (Math.random()*100)+'vh';
  s.style.animationDelay = (Math.random()*2)+'s';
  ambient.appendChild(s);
  setTimeout(()=>s.remove(), 7000);
}
setInterval(spawnSpark, 1400);

/* ============================================================
   MÚSICA SUAVE GENERADA CON WEB AUDIO API
   (sin archivos externos, para que el HTML funcione sin conexión)
   ============================================================ */
let audioCtx=null, musicNodes=[], musicPlaying=false;
function buildAmbientMusic(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const master = audioCtx.createGain();
  master.gain.value = 0.0001;
  master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime+2.5);

  // Acorde suave de fondo (pad) usando varios osciladores sinusoidales
  const notes = [261.63, 329.63, 392.00, 523.25]; // C4 E4 G4 C5
  notes.forEach((freq,i)=>{
    const osc = audioCtx.createOscillator();
    osc.type='sine';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0.22 - i*0.03;
    // leve vibrato/movimiento para que suene vivo
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.08 + i*0.03;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 2.5;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    osc.connect(g);
    g.connect(master);
    osc.start(); lfo.start();
    musicNodes.push(osc, lfo);
  });
  musicNodes.push(master);
  return master;
}
let masterGainRef = null;
document.getElementById('music-toggle').addEventListener('click', function(){
  if(!audioCtx){
    masterGainRef = buildAmbientMusic();
    musicPlaying = true;
    this.textContent='🔊';
    return;
  }
  if(musicPlaying){
    masterGainRef.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime+1);
    musicPlaying=false;
    this.textContent='🔇';
  } else {
    masterGainRef.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime+1);
    musicPlaying=true;
    this.textContent='🔊';
  }
});

/* Sonido corto y suave, tipo "campanita", al presionar el girasol */
function playChime(){
  try{
    const ctx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='sine';
    o.frequency.value = 880;
    g.gain.value=0.0001;
    o.connect(g); g.connect(ctx.destination);
    g.gain.linearRampToValueAtTime(0.12, ctx.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+1.1);
    o.start();
    o.stop(ctx.currentTime+1.2);
  }catch(e){}
}

/* ============================================================
   SVG DE UN PEQUEÑO GIRASOL (reutilizable)
   ============================================================ */
function sunflowerSVG(){
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <g>
      ${Array.from({length:10}).map((_,i)=>{
        const angle = i*36;
        return `<ellipse cx="20" cy="7" rx="5" ry="9" fill="url(#petalGrad)"
          transform="rotate(${angle} 20 20)" />`;
      }).join('')}
      <circle cx="20" cy="20" r="7.5" fill="url(#centerGrad)" />
    </g>
    <defs>
      <radialGradient id="petalGrad" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="55%" stop-color="#f6c243"/>
        <stop offset="100%" stop-color="#e8a916"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#a9793e"/>
        <stop offset="100%" stop-color="#5c3a1a"/>
      </radialGradient>
    </defs>
  </svg>`;
}

/* ============================================================
   ESCENA 2 → construcción del tallo, hojas y corazón de girasoles
   ============================================================ */
const startBtn = document.getElementById('start-btn');
const stemSvg = document.getElementById('stem-svg');
const growthWrap = document.getElementById('growth-wrap');
const heartLayer = document.getElementById('heart-layer');

function heartOutline(count){
  // Ecuación paramétrica de corazón (silueta / borde)
  const pts=[];
  for(let i=0;i<count;i++){
    const t = (i/count)*Math.PI*2;
    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    pts.push({x,y});
  }
  return pts;
}

/* Genera puntos ALEATORIOS pero garantizados dentro del corazón,
   escalando cada punto del borde hacia un centro interior
   (el corazón es "estrellado" respecto a su centro de masa, así que
   esto nunca produce girasoles sueltos fuera de la silueta). */
function heartInterior(count, fineBoundary){
  let sumY=0;
  fineBoundary.forEach(p=>sumY+=p.y);
  const cy = sumY/fineBoundary.length;
  const cx = 0;
  const pts=[];
  for(let i=0;i<count;i++){
    const b = fineBoundary[Math.floor(Math.random()*fineBoundary.length)];
    // sqrt() da una distribución uniforme por ÁREA (no amontonada en el centro)
    const r = Math.sqrt(Math.random())*0.97;
    pts.push({ x: cx + r*(b.x-cx), y: cy + r*(b.y-cy) });
  }
  return pts;
}

let growthStarted = false;
startBtn.addEventListener('click', ()=>{
  playChime();
  if(!audioCtx){ buildAmbientMusic(); musicPlaying=true; document.getElementById('music-toggle').textContent='🔊'; }
  goToScene('scene-2');
  if(!growthStarted){
    growthStarted = true;
    buildGrowthScene();
  }
});

function buildGrowthScene(){
  // Dibuja el tallo principal como un path curvo
  const stemPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  stemPath.setAttribute('d','M150,500 C150,420 145,350 150,270 C154,210 150,160 150,110');
  stemPath.setAttribute('class','stem-path');
  stemSvg.appendChild(stemPath);

  // Hojas a los lados del tallo
  const leafDefs = [
    {x:150,y:400,rx:-1,rot:-25},
    {x:150,y:340,rx:1,rot:25},
    {x:150,y:260,rx:-1,rot:-20},
    {x:150,y:190,rx:1,rot:20}
  ];
  leafDefs.forEach((l,i)=>{
    const leaf = document.createElementNS('http://www.w3.org/2000/svg','path');
    const w = 46*l.rx;
    leaf.setAttribute('d',`M${l.x},${l.y} C${l.x+w},${l.y-18} ${l.x+w},${l.y+18} ${l.x},${l.y+4} Z`);
    leaf.setAttribute('class','leaf');
    leaf.style.animationDelay = (2 + i*0.35)+'s';
    leaf.style.transformOrigin = `${l.x}px ${l.y}px`;
    stemSvg.appendChild(leaf);
  });

  const wrapRect = growthWrap.getBoundingClientRect();
  const cx = wrapRect.width/2;
  const cyTop = wrapRect.height*0.28;
  const scale = Math.min(wrapRect.width,wrapRect.height)/34;

  function placeFlower(pt, delay, size){
    const f = document.createElement('div');
    f.className='heart-flower';
    f.innerHTML = sunflowerSVG();
    f.style.left = (cx + pt.x*scale)+'px';
    f.style.top = (cyTop + pt.y*scale*0.92)+'px';
    f.style.width = size+'px';
    f.style.height = size+'px';
    f.style.animationDelay = delay+'s';
    f.style.zIndex = Math.round(size);
    heartLayer.appendChild(f);
  }

  // 1) SILUETA: se traza primero el contorno del corazón, en orden,
  //    para que la forma se vea perfectamente definida
  const fineBoundary = heartOutline(240);
  const silhouette = heartOutline(85);
  const silhouetteStep = 0.045;
  silhouette.forEach((pt,i)=>{
    const delay = 5 + i*silhouetteStep;
    placeFlower(pt, delay, 19 + Math.random()*7);
  });
  const silhouetteEnd = 5 + silhouette.length*silhouetteStep;

  // 2) RELLENO INTERIOR: brota de forma ALEATORIA (no en secuencia),
  //    dando la sensación de que son girasoles infinitos.
  //    Varias capas grandes para el cuerpo, y dos capas finales de
  //    girasoles pequeños para tapar los micro-espacios entre pétalos,
  //    hasta que no quede ni un solo hueco en blanco.
  const interior = heartInterior(240, fineBoundary)
    .concat(heartInterior(200, fineBoundary))
    .concat(heartInterior(160, fineBoundary))
    .concat(heartInterior(140, fineBoundary))
    .concat(heartInterior(120, fineBoundary));
  const microFill = heartInterior(160, fineBoundary)
    .concat(heartInterior(140, fineBoundary));
  const randomWindow = 9.5;
  let maxDelay = silhouetteEnd;
  interior.forEach((pt)=>{
    const delay = silhouetteEnd + 0.2 + Math.random()*randomWindow;
    if(delay>maxDelay) maxDelay = delay;
    placeFlower(pt, delay, 16 + Math.random()*20);
  });
  microFill.forEach((pt)=>{
    const delay = silhouetteEnd + randomWindow*0.5 + Math.random()*(randomWindow*0.7);
    if(delay>maxDelay) maxDelay = delay;
    placeFlower(pt, delay, 8 + Math.random()*8);
  });

  // Cuando el corazón está completo: la planta se desplaza a la derecha
  // (sin perder el tallo) y aparece el panel de dedicatoria a la izquierda
  setTimeout(()=>{
    revealDedicationPanel();
  }, (maxDelay+1.7)*1000);
}

/* ============================================================
   Tras completarse el corazón: desplaza la planta y muestra
   el panel de dedicatoria (todo dentro de la misma escena)
   ============================================================ */
function revealDedicationPanel(){
  document.getElementById('plant-stage').classList.add('filled');
  document.getElementById('glow-ring').classList.add('show');

  setTimeout(()=>{
    heartLayer.classList.add('beat');
    playChime();
  }, 500);

  setTimeout(()=>{
    document.getElementById('headline-3').classList.add('show');
  }, 900);

  // Dedicatoria con efecto de escritura
  const dedicationText = [
    "Mi Princesa ❤️",
    "SSRV",
    "Aunque hoy no puedo entregarte estas flores amarillas en persona, quería encontrar una forma especial de hacerte llegar este detalle.",
    "Por eso hice estas flores para ti, flores que nunca se marchitan y que siempre estarán aquí cuando quieras volver a verlas.",
    "Cada girasol que ves aquí representa un latido de mi corazón, un pequeño pedacito de mi amor y una razón más para recordarte lo especial que eres para mí.",
    "Así como el sol ilumina los campos y hace florecer cada flor, tú tienes esa forma única de iluminar mi vida y hacer que mis días sean más bonitos.",
    "Gracias por ser esa persona que hace florecer mi mundo.",
    "Te amo mucho ❤️"
  ];

  const dedicationEl = document.getElementById('dedication');
  setTimeout(()=>{
    dedicationEl.classList.add('show');
    typeParagraphs(dedicationEl, dedicationText, 0, ()=>{
      document.getElementById('continue-btn').classList.add('show');
    });
  }, 1800);
}

function typeParagraphs(container, lines, idx, onDone){
  if(idx>=lines.length){ onDone && onDone(); return; }
  const p = document.createElement('p');
  if(idx===0){ p.style.fontSize='1.3rem'; }
  if(idx===1){ p.classList.add('signature','dsign'); }
  container.appendChild(p);
  let ci=0;
  const text = lines[idx];
  const speed = idx===1 ? 60 : 18;
  const timer = setInterval(()=>{
    p.textContent = text.slice(0, ci+1);
    ci++;
    if(ci>=text.length){
      clearInterval(timer);
      setTimeout(()=>typeParagraphs(container, lines, idx+1, onDone), idx===0||idx===1?300:450);
    }
  }, speed);
}

document.getElementById('continue-btn').addEventListener('click', ()=>{
  goToScene('scene-4');
});

document.getElementById('replay-btn').addEventListener('click', ()=>{
  location.reload();
});
</script>
